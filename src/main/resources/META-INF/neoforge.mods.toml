modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/To0pa/Unusual-Furniture/issues"

[[mods]]
modId = "unusual_furniture"
version = "${version}"
displayName = "Unusual Furniture"
description = '''Vanilla styled furniture mod!'''
authors = "to0pa, macuguita"
logoFile = "assets/unusual_furniture/logo.png"
logoBlur = false
displayURL = "https://www.curseforge.com/minecraft/mc-mods/unusual-furniture"
issueTrackerURL = "https://github.com/To0pa/Unusual-Furniture/issues"
updateJSONURL = "https://api.modrinth.com/updates/MZFE37e3/forge_updates.json?neoforge=only"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "unusual_furniture.mixins.json"

[[dependencies.unusual_furniture]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"

[[dependencies.unusual_furniture]]
modId = "sable"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[modproperties.unusual_furniture]
catalogueImageIcon = "assets/unusual_furniture/logo.png"
